<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>NoorCompass — moved to noorcompass.com</title>
    <link rel="canonical" href="https://noorcompass.com/">
    <script>
        (() => {
            const here = new URL(location.href);
            const target = new URL('https://noorcompass.com' + here.pathname + here.search + here.hash);
            window.location.replace(target.href);
        })();
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: #f7f8fc;
            color: #0d1532;
        }
        .box { max-width: 420px; padding: 40px; text-align: center; }
        h1 { font-size: 1.4rem; margin: 0 0 12px; }
        p { color: #626b84; line-height: 1.5; margin: 0 0 8px; }
        a { color: #6a3be4; }
    </style>
</head>
<body>
    <div class="box">
        <h1>NoorCompass has moved</h1>
        <p>This site now lives at <a href="https://noorcompass.com/">noorcompass.com</a>.</p>
        <p>If you are not redirected automatically, <a id="manual-link" href="https://noorcompass.com/">tap here</a>.</p>
    </div>
    <script>
        document.getElementById('manual-link').href =
            'https://noorcompass.com' + location.pathname + location.search + location.hash;
    </script>
</body>
</html>
